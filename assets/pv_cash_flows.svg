<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="nomGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="pvGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="800" height="400" rx="16" fill="url(#bgGrad)"/>

  <!-- Header -->
  <text x="40" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#f8fafc">Nominal FCFF vs. Present Value (PV) of Cash Flows</text>
  <text x="40" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#94a3b8">Impact of 11.9% WACC Discount Rate Across 5-Year Forecast Horizon</text>

  <!-- Legend -->
  <rect x="520" y="40" width="14" height="14" rx="3" fill="url(#nomGrad)"/>
  <text x="542" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#cbd5e1">Nominal FCFF</text>
  
  <rect x="650" y="40" width="14" height="14" rx="3" fill="url(#pvGrad)"/>
  <text x="672" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#cbd5e1">PV (at WACC)</text>

  <!-- Gridlines -->
  <g stroke="#334155" stroke-dasharray="4 4" stroke-width="1">
    <line x1="80" y1="110" x2="740" y2="110"/>
    <line x1="80" y1="170" x2="740" y2="170"/>
    <line x1="80" y1="230" x2="740" y2="230"/>
    <line x1="80" y1="290" x2="740" y2="290"/>
    <line x1="80" y1="350" x2="740" y2="350"/>
  </g>

  <!-- Y-Axis -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b" text-anchor="end">
    <text x="70" y="114">$300M</text>
    <text x="70" y="174">$225M</text>
    <text x="70" y="234">$150M</text>
    <text x="70" y="294">$75M</text>
    <text x="70" y="354">$0M</text>
  </g>

  <!-- Bars for Years 1-5 -->
  <!-- Scale: 300M = 240px. 1M = 0.8px -->

  <!-- Year 1: Nom=$189.00M (151.2px, Y=198.8), PV=$168.90M (135.1px, Y=214.9) -->
  <g transform="translate(100,0)">
    <rect x="15" y="198.8" width="36" height="151.2" rx="4" fill="url(#nomGrad)" filter="url(#shadow)"/>
    <text x="33" y="192.8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#38bdf8" text-anchor="middle">$189.0M</text>
    
    <rect x="57" y="214.9" width="36" height="135.1" rx="4" fill="url(#pvGrad)" filter="url(#shadow)"/>
    <text x="75" y="208.9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#a5b4fc" text-anchor="middle">$168.9M</text>
    
    <text x="54" y="372" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">Year 1</text>
  </g>

  <!-- Year 2: Nom=$204.12M (163.3px, Y=186.7), PV=$163.01M (130.4px, Y=219.6) -->
  <g transform="translate(230,0)">
    <rect x="15" y="186.7" width="36" height="163.3" rx="4" fill="url(#nomGrad)" filter="url(#shadow)"/>
    <text x="33" y="180.7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#38bdf8" text-anchor="middle">$204.1M</text>
    
    <rect x="57" y="219.6" width="36" height="130.4" rx="4" fill="url(#pvGrad)" filter="url(#shadow)"/>
    <text x="75" y="213.6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#a5b4fc" text-anchor="middle">$163.0M</text>
    
    <text x="54" y="372" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">Year 2</text>
  </g>

  <!-- Year 3: Nom=$220.45M (176.4px, Y=173.6), PV=$157.33M (125.9px, Y=224.1) -->
  <g transform="translate(360,0)">
    <rect x="15" y="173.6" width="36" height="176.4" rx="4" fill="url(#nomGrad)" filter="url(#shadow)"/>
    <text x="33" y="167.6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#38bdf8" text-anchor="middle">$220.5M</text>
    
    <rect x="57" y="224.1" width="36" height="125.9" rx="4" fill="url(#pvGrad)" filter="url(#shadow)"/>
    <text x="75" y="218.1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#a5b4fc" text-anchor="middle">$157.3M</text>
    
    <text x="54" y="372" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">Year 3</text>
  </g>

  <!-- Year 4: Nom=$238.09M (190.5px, Y=159.5), PV=$151.85M (121.5px, Y=228.5) -->
  <g transform="translate(490,0)">
    <rect x="15" y="159.5" width="36" height="190.5" rx="4" fill="url(#nomGrad)" filter="url(#shadow)"/>
    <text x="33" y="153.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#38bdf8" text-anchor="middle">$238.1M</text>
    
    <rect x="57" y="228.5" width="36" height="121.5" rx="4" fill="url(#pvGrad)" filter="url(#shadow)"/>
    <text x="75" y="222.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#a5b4fc" text-anchor="middle">$151.9M</text>
    
    <text x="54" y="372" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">Year 4</text>
  </g>

  <!-- Year 5: Nom=$257.13M (205.7px, Y=144.3), PV=$146.56M (117.2px, Y=232.8) -->
  <g transform="translate(620,0)">
    <rect x="15" y="144.3" width="36" height="205.7" rx="4" fill="url(#nomGrad)" filter="url(#shadow)"/>
    <text x="33" y="138.3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#38bdf8" text-anchor="middle">$257.1M</text>
    
    <rect x="57" y="232.8" width="36" height="117.2" rx="4" fill="url(#pvGrad)" filter="url(#shadow)"/>
    <text x="75" y="226.8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#a5b4fc" text-anchor="middle">$146.6M</text>
    
    <text x="54" y="372" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">Year 5</text>
  </g>
</svg>
