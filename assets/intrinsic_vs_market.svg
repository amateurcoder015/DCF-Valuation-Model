<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="intrGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="mktGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="800" height="400" rx="16" fill="url(#bgGrad)"/>

  <!-- Title & Subtitle -->
  <text x="40" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#f8fafc">Intrinsic Share Price vs. Live Market Price</text>
  <text x="40" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#94a3b8">Valuation Result: Model Intrinsic Price vs. Actual Traded Share Price</text>

  <!-- Verdict Badge -->
  <g transform="translate(540, 30)">
    <rect width="220" height="45" rx="8" fill="#881337" opacity="0.7" stroke="#f43f5e" stroke-width="1"/>
    <text x="110" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#fecdd3" text-anchor="middle">VALUATION VERDICT</text>
    <text x="110" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="800" fill="#fb7185" text-anchor="middle">OVERVALUED (-23.79%)</text>
  </g>

  <!-- Gridlines -->
  <g stroke="#334155" stroke-dasharray="4 4" stroke-width="1">
    <line x1="80" y1="110" x2="740" y2="110"/>
    <line x1="80" y1="170" x2="740" y2="170"/>
    <line x1="80" y1="230" x2="740" y2="230"/>
    <line x1="80" y1="290" x2="740" y2="290"/>
    <line x1="80" y1="350" x2="740" y2="350"/>
  </g>

  <!-- Y-Axis -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b" text-anchor="end">
    <text x="70" y="114">$35.00</text>
    <text x="70" y="174">$26.25</text>
    <text x="70" y="234">$17.50</text>
    <text x="70" y="294">$8.75</text>
    <text x="70" y="354">$0.00</text>
  </g>

  <!-- Scale: $35.00 = 240px. $1 = 6.857px -->

  <!-- Bar 1: Intrinsic Share Price = $21.34 -> Height = 146.3px. Y = 350 - 146.3 = 203.7 -->
  <g transform="translate(200, 0)">
    <rect x="0" y="203.7" width="120" height="146.3" rx="8" fill="url(#intrGrad)" filter="url(#shadow)"/>
    <text x="60" y="193.7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" fill="#34d399" text-anchor="middle">$21.34</text>
    <text x="60" y="372" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#94a3b8" text-anchor="middle">Intrinsic DCF Price</text>
  </g>

  <!-- Bar 2: Market Share Price = $28.00 -> Height = 192px. Y = 350 - 192 = 158 -->
  <g transform="translate(480, 0)">
    <rect x="0" y="158" width="120" height="192" rx="8" fill="url(#mktGrad)" filter="url(#shadow)"/>
    <text x="60" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" fill="#fb7185" text-anchor="middle">$28.00</text>
    <text x="60" y="372" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#94a3b8" text-anchor="middle">Current Market Price</text>
  </g>

  <!-- Difference Indicator Arrow / Line -->
  <line x1="320" y1="203.7" x2="480" y2="203.7" stroke="#fb7185" stroke-dasharray="3 3" stroke-width="1.5"/>
  <line x1="480" y1="158" x2="480" y2="203.7" stroke="#fb7185" stroke-width="2"/>
  <text x="400" y="195" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#fb7185" text-anchor="middle">-$6.66 (-23.79%)</text>
</svg>
