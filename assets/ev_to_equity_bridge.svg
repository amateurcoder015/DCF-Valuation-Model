<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="evGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="debtGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <linearGradient id="cashGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="eqGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="800" height="400" rx="16" fill="url(#bgGrad)"/>

  <!-- Title & Subtitle -->
  <text x="40" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#f8fafc">Enterprise Value to Equity Value Bridge</text>
  <text x="40" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#94a3b8">Bridge Waterfall: Operating Assets to Net Common Equity Value</text>

  <!-- Gridlines -->
  <g stroke="#334155" stroke-dasharray="4 4" stroke-width="1">
    <line x1="80" y1="110" x2="740" y2="110"/>
    <line x1="80" y1="170" x2="740" y2="170"/>
    <line x1="80" y1="230" x2="740" y2="230"/>
    <line x1="80" y1="290" x2="740" y2="290"/>
    <line x1="80" y1="350" x2="740" y2="350"/>
  </g>

  <!-- Y-Axis -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b" text-anchor="end">
    <text x="70" y="114">$3,000M</text>
    <text x="70" y="174">$2,250M</text>
    <text x="70" y="234">$1,500M</text>
    <text x="70" y="294">$750M</text>
    <text x="70" y="354">$0M</text>
  </g>

  <!-- Waterfall Bars -->
  <!-- Scale: 3000M = 240px. 1M = 0.08px -->

  <!-- Bar 1: Enterprise Value = $2,483.76M -> Height = 198.7px. Y = 350 - 198.7 = 151.3 -->
  <g transform="translate(110, 0)">
    <rect x="0" y="151.3" width="90" height="198.7" rx="6" fill="url(#evGrad)" filter="url(#shadow)"/>
    <text x="45" y="141.3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#38bdf8" text-anchor="middle">$2,483.76M</text>
    <text x="45" y="372" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#94a3b8" text-anchor="middle">Enterprise Value</text>
  </g>

  <!-- Connector Line 1 -->
  <line x1="200" y1="151.3" x2="270" y2="151.3" stroke="#f43f5e" stroke-dasharray="3 3" stroke-width="1.5"/>

  <!-- Bar 2: Less Total Debt = -$500.00M -> Starts at Y=151.3, Height = 40px, Y_end = 191.3 -->
  <g transform="translate(270, 0)">
    <rect x="0" y="151.3" width="90" height="40" rx="6" fill="url(#debtGrad)" filter="url(#shadow)"/>
    <text x="45" y="141.3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#fb7185" text-anchor="middle">-$500.00M</text>
    <text x="45" y="372" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#94a3b8" text-anchor="middle">Total Debt (-)</text>
  </g>

  <!-- Connector Line 2 -->
  <line x1="360" y1="191.3" x2="430" y2="191.3" stroke="#34d399" stroke-dasharray="3 3" stroke-width="1.5"/>

  <!-- Bar 3: Plus Cash & Equiv = +$150.00M -> Starts at Y=191.3 - 12 = 179.3, Height = 12px -->
  <g transform="translate(430, 0)">
    <rect x="0" y="179.3" width="90" height="12" rx="4" fill="url(#cashGrad)" filter="url(#shadow)"/>
    <text x="45" y="169.3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#34d399" text-anchor="middle">+$150.00M</text>
    <text x="45" y="372" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#94a3b8" text-anchor="middle">Cash (+)</text>
  </g>

  <!-- Connector Line 3 -->
  <line x1="520" y1="179.3" x2="590" y2="179.3" stroke="#818cf8" stroke-dasharray="3 3" stroke-width="1.5"/>

  <!-- Bar 4: Equity Value = $2,133.76M -> Height = 170.7px. Y = 350 - 170.7 = 179.3 -->
  <g transform="translate(590, 0)">
    <rect x="0" y="179.3" width="90" height="170.7" rx="6" fill="url(#eqGrad)" filter="url(#shadow)"/>
    <text x="45" y="169.3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#a5b4fc" text-anchor="middle">$2,133.76M</text>
    <text x="45" y="372" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#94a3b8" text-anchor="middle">Equity Value</text>
  </g>
</svg>
